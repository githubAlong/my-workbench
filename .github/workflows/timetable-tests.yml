name: Timetable import and drag checks

on:
  push:
    branches:
      - dev
    paths:
      - "js/ttimage.js"
      - "js/work.js"
      - "tests/timetable-row-mapping.test.mjs"
      - ".github/workflows/timetable-tests.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "js/ttimage.js"
      - "js/work.js"
      - "tests/timetable-row-mapping.test.mjs"
      - ".github/workflows/timetable-tests.yml"

permissions:
  contents: read

jobs:
  timetable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check js/ttimage.js
          node --check js/work.js
      - name: Test timetable lesson numbering
        run: node --test tests/timetable-row-mapping.test.mjs
