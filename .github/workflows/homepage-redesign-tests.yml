name: Homepage redesign validation

on:
  push:
    branches:
      - feature/homepage-redesign
      - feature/clean-homepage-weather
      - test
      - dev
    paths:
      - "js/home.js"
      - "js/homegrid.js"
      - "js/ui.js"
      - "js/me.js"
      - "css/app.css"
      - "css/teacher-ui.css"
      - "sw.js"
      - "tests/**"
      - "scripts/check-project.mjs"
      - "package.json"
      - ".github/workflows/homepage-redesign-tests.yml"
  pull_request:
    branches:
      - test
      - dev
    paths:
      - "js/home.js"
      - "js/homegrid.js"
      - "css/teacher-ui.css"
      - "tests/**"
      - "scripts/check-project.mjs"
      - "package.json"
      - ".github/workflows/homepage-redesign-tests.yml"

permissions:
  contents: read

jobs:
  homepage-and-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changed JavaScript syntax
        run: |
          node --check js/home.js
          node --check js/homegrid.js
          node --check js/ui.js
          node --check js/me.js
      - name: Run complete Node test suite
        run: npm test
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          npm run preview > /tmp/homepage-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/homepage-preview.log
          exit 1
      - name: Run desktop tablet and mobile browser smoke tests
        run: npx playwright test tests/browser/homepage-smoke.spec.mjs --reporter=line
      - name: Upload desktop tablet and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-browser-screenshots
          path: artifacts/homepage-*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Run repository integrity checks
        run: npm run check
