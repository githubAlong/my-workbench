<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>我的工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的工作台">
<meta name="theme-color" content="#007aff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/app.css">
<script>
  (function () {
    try {
      var OK = ['light', 'dark', 'green', 'warm', 'pink', 'ocean'];
      var META = { light: '#f2f2f7', dark: '#000000', green: '#eaf2ea', warm: '#f7f1e6', pink: '#fbf0f4', ocean: '#eaf3f8' };
      var t = localStorage.getItem('wb_theme');
      try { t = JSON.parse(t); } catch (e) {}
      if (OK.indexOf(t) < 0) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      var m = document.querySelector('meta[name=theme-color]');
      if (m && META[t]) m.content = META[t];
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="app"></div>
<div id="alarm-root"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
