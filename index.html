<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>教师个人工作台已迁移</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;
       font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#f5f6f8;color:#2a2f3a;padding:24px;box-sizing:border-box}
  .box{max-width:340px;text-align:center}
  .logo{width:52px;height:52px;border-radius:15px;margin:0 auto 16px;display:grid;place-items:center;
        background:linear-gradient(135deg,#4f6ef7,#7b5cf0);color:#fff;font-size:22px;font-weight:700}
  h1{font-size:17px;margin:0 0 8px;font-weight:700}
  p{font-size:13.5px;line-height:1.65;color:#6b7280;margin:0 0 18px}
  code{font-size:12px;background:#eceef2;padding:1px 5px;border-radius:5px}
  a{display:inline-block;padding:11px 20px;border-radius:12px;background:#4f6ef7;color:#fff;
    font-size:15px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="logo">台</div>
  <h1 id="title">正在前往新地址…</h1>
  <p>工作台已统一到 <code>mywork-master</code> 站点。本机资料和登录状态都在同一个域名下，不会丢。没有自动跳转请点下面按钮。</p>
  <a id="go" href="./">立即前往</a>
</div>
<script>
(function () {
  /* 只保留一个对外地址：老的 /my-workbench/ 站点不再放应用代码。
     这里必须带着 hash 和 query 一起跳——书签里的 #/attendance/高一
     和学生端链接上的 ?cls= 参数都还要能用。
     这一页原来是真实应用壳，所以教师端落到新站的 app.html（index.html 是设计稿登录页）。 */
  var OLD = '/my-workbench/';
  var NEW = '/mywork-master/';
  var at = location.pathname.indexOf(OLD);
  var link = document.getElementById('go');
  if (at < 0) {
    document.getElementById('title').textContent = '这里已经是正式地址';
    link.href = './';
    return;
  }
  var target = location.origin + NEW + 'app.html' + location.search + location.hash;
  link.href = target;
  location.replace(target);
}());
</script>
</body>
</html>
