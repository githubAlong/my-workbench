<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的工作台</title>
<style>
:root{
  --purple:#7C5CFF;--purple-600:#6A45F2;--purple-700:#5A35D6;
  --purple-50:#F5F2FF;--purple-100:#EAE4FF;--purple-200:#D8CEFF;
  --ink:#221B36;--ink-2:#5B5372;--ink-3:#918BA4;
  --line:rgba(34,27,54,.09);
  --card:rgba(255,255,255,.82);
  --red:#F43F5E;--orange:#F97316;--amber:#F59E0B;--green:#16A34A;
  --blue:#3B82F6;--pink:#EC4899;--teal:#0D9488;--gray:#8E8899;
  --shadow-sm:0 4px 14px rgba(76,53,138,.08);
  --shadow-md:0 10px 30px rgba(76,53,138,.12);
  --shadow-lg:0 24px 70px rgba(64,45,120,.22);
  --r:14px;--r-sm:9px;
}
*{margin:0;padding:0;box-sizing:border-box}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;outline:none;font-size:14px}
body{height:100vh;overflow:hidden;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1100px 720px at 12% 6%,rgba(167,139,250,.5),transparent 60%),
    radial-gradient(920px 700px at 88% 10%,rgba(124,92,255,.36),transparent 58%),
    radial-gradient(1000px 820px at 76% 94%,rgba(236,72,153,.2),transparent 60%),
    linear-gradient(155deg,#F1ECFF 0%,#E5DEFF 45%,#F7E9FF 100%);
  -webkit-font-smoothing:antialiased;text-size-adjust:100%;touch-action:manipulation}
.ic{width:18px;height:18px;display:block;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.small{font-size:11.5px}.muted{color:var(--ink-3)}
.empty{padding:32px 16px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.7}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(124,92,255,.25);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.topbar{flex:none;height:54px;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(255,255,255,.6);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);position:relative;z-index:30}
.topbar .hamb{display:none;width:36px;height:36px;border-radius:9px;align-items:center;justify-content:center}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--purple),var(--purple-600));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.brand{font-weight:600;font-size:15px;white-space:nowrap}
.search{flex:1;max-width:420px;margin:0 auto;position:relative}
.search input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.7);
  padding:0 12px 0 34px;color:var(--ink)}
.search .ic{position:absolute;left:10px;top:9px;color:var(--ink-3)}
.top-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--purple-100);color:var(--purple-700);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.body{flex:1;display:flex;min-height:0}
.sidebar{flex:none;width:226px;background:rgba(255,255,255,.55);backdrop-filter:blur(18px);
  border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.nav-group-label{font-size:11px;color:var(--ink-3);font-weight:600;padding:12px 12px 4px;letter-spacing:.04em}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink-2);
  font-size:14px;font-weight:500;cursor:pointer;position:relative;user-select:none}
.nav-item:hover{background:rgba(124,92,255,.08)}
.nav-item.active{background:linear-gradient(135deg,var(--purple),var(--purple-600));color:#fff;box-shadow:var(--shadow-sm)}
.nav-item .ic{width:18px;height:18px;color:var(--purple-700)}
.nav-item.active .ic{color:#fff}
.nav-item .badge{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:9px;padding:1px 7px;font-weight:600}
.nav-item.active .badge{background:rgba(255,255,255,.25);color:#fff}
.nav-group>.nav-item .chev{margin-left:auto;transition:transform .2s;width:16px;height:16px}
.nav-group.collapsed>.nav-item .chev{transform:rotate(-90deg)}
.nav-children{display:flex;flex-direction:column;gap:2px;margin-left:14px;overflow:hidden}
.nav-group.collapsed>.nav-children{display:none}
.nav-children .nav-item{font-size:13px;padding:7px 12px}
.main{flex:1;min-width:0;overflow-y:auto;padding:18px;position:relative}
.sidebar-mask{display:none;position:fixed;inset:0;background:rgba(20,12,40,.35);z-index:40}

.view-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.view-head h1{font-size:17px;font-weight:600}
.view-head .sub{color:var(--ink-3);font-size:12.5px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;
  font-size:13.5px;font-weight:600;background:#fff;border:1px solid var(--line);color:var(--ink-2);
  box-shadow:var(--shadow-sm);transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--purple),var(--purple-600));color:#fff;border:none}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--red);border-color:rgba(244,63,94,.3)}
.btn .ic{width:15px;height:15px}

.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm);backdrop-filter:blur(10px)}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-head h2{font-size:14.5px;font-weight:600}
.card-head .ic{width:16px;height:16px;color:var(--purple-700)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;font-size:11.5px;color:var(--ink-3);background:transparent;cursor:pointer;font-weight:500}
.chip.active{background:var(--purple-100);color:var(--purple-700);font-weight:600}
.stat{background:linear-gradient(135deg,var(--purple-50),#fff);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-size:22px;font-weight:700;color:var(--purple-700);line-height:1.1}
.stat .v small{font-size:12px;font-weight:600;color:var(--ink-3)}
.stat .k{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.progress{height:7px;border-radius:5px;background:var(--purple-100);overflow:hidden;margin-top:8px}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--purple-600));border-radius:5px}

.task{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:.12s}
.task:hover{background:rgba(124,92,255,.06)}
.task+.task{border-top:1px solid var(--line)}
.cbox{width:19px;height:19px;border-radius:6px;border:2px solid var(--purple-200);flex:none;display:flex;align-items:center;justify-content:center;transition:.15s}
.cbox.done{background:var(--purple);border-color:var(--purple)}
.cbox.done .ic{stroke:#fff;width:12px;height:12px}
.task .t-title{flex:1;font-size:13px}
.task.done .t-title{color:var(--ink-3);text-decoration:line-through}
.task .t-meta{font-size:11px;color:var(--ink-3)}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:600;background:var(--purple-100);color:var(--purple-700)}
.tag.orange{background:#FFE9D6;color:var(--orange)}
.tag.green{background:#DCFCE7;color:var(--green)}
.tag.blue{background:#DBEAFE;color:var(--blue)}
.tag.red{background:#FFE4E9;color:var(--red)}
.tag.gray{background:#EFEFF2;color:var(--gray)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px}

.hero{background:linear-gradient(135deg,var(--purple),var(--purple-600));border-radius:18px;padding:20px 22px;color:#fff;
  box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.hero .greet{font-size:14px;opacity:.92}
.hero h1{font-size:21px;font-weight:600;margin:2px 0 10px}
.hero .clock{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px;line-height:1}
.hero .nxt{margin-top:10px;font-size:13px;opacity:.95;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero .nxt b{font-weight:600}
.hero .sw{margin-top:12px;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;font-size:12.5px;cursor:pointer}
.hero .sw .toggle{width:34px;height:19px;border-radius:999px;background:rgba(255,255,255,.35);position:relative;transition:.2s}
.hero .sw .toggle.on{background:#fff}
.hero .sw .toggle i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--purple);transition:.2s}
.hero .sw .toggle.on i{left:17px;background:var(--purple-600)}
.hero .deco{position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .deco2{position:absolute;right:60px;bottom:-50px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}

.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head .mt{font-size:14px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;color:var(--ink-3);padding:4px 0;font-weight:600}
.cal-cell{aspect-ratio:1/1;border-radius:9px;padding:4px;font-size:12px;color:var(--ink-2);cursor:pointer;
  border:1px solid transparent;display:flex;flex-direction:column;gap:2px;position:relative;transition:.12s}
.cal-cell:hover{background:rgba(124,92,255,.07)}
.cal-cell.today{border-color:var(--purple);color:var(--purple-700);font-weight:700}
.cal-cell.sel{background:var(--purple);color:#fff}
.cal-cell.sel .cal-dots .dot{outline:1px solid #fff}
.cal-cell.out{color:var(--ink-3);opacity:.45}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}
.cal-dots .dot{width:6px;height:6px;border-radius:50%}

.quote{font-size:14px;line-height:1.7}
.quote .en{font-style:italic;color:var(--ink-2)}
.quote .zh{color:var(--ink);margin-top:4px}
.quote .by{color:var(--ink-3);font-size:12px;margin-top:8px;text-align:right}
.wx{display:flex;align-items:center;gap:14px}
.wx .temp{font-size:30px;font-weight:700}
.wx .desc{font-size:13px;color:var(--ink-2)}
.wx .meta{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.news-item{padding:9px 0;border-top:1px solid var(--line);font-size:13px;display:flex;gap:8px}
.news-item:first-child{border-top:none}
.news-item .nidx{color:var(--purple-700);font-weight:700;flex:none}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.pager button{width:28px;height:28px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}

table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tbody tr:hover{background:rgba(124,92,255,.04)}
.idx{color:var(--ink-3);font-variant-numeric:tabular-nums;width:34px}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.row-actions button{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.row-actions button:hover{background:var(--purple-50);color:var(--purple-700)}

.sched{display:grid;grid-template-columns:54px repeat(7,1fr);gap:5px;font-size:11.5px}
.sched .sh{background:var(--purple-50);color:var(--purple-700);border-radius:8px;padding:6px 4px;text-align:center;font-weight:600}
.sched .sd{background:var(--purple-100);color:var(--purple-700);border-radius:8px;padding:6px 4px;text-align:center;font-weight:700}
.sched .sd.today{background:var(--purple);color:#fff}
.sched .cell{min-height:52px;border:1px dashed var(--line);border-radius:8px;padding:4px;cursor:pointer;position:relative;transition:.12s}
.sched .cell:hover{border-color:var(--purple);background:rgba(124,92,255,.05)}
.sched .cell.today{background:rgba(124,92,255,.08);border-style:solid}
.sched .crs{background:linear-gradient(135deg,var(--purple-100),#fff);border:1px solid var(--purple-200);border-radius:7px;
  padding:4px 5px;margin-bottom:3px;cursor:pointer;font-size:11px;line-height:1.3}
.sched .crs:hover{box-shadow:var(--shadow-sm)}
.sched .crs b{font-weight:600;color:var(--purple-700)}

.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.sticky{background:#FFF7D6;border-radius:12px;padding:12px 13px;box-shadow:var(--shadow-sm);position:relative;min-height:96px;
  display:flex;flex-direction:column;gap:8px;border:1px solid rgba(0,0,0,.04)}
.sticky.green{background:#DCFCE7}.sticky.blue{background:#DBEAFE}.sticky.pink{background:#FCE7F3}.sticky.purple{background:var(--purple-50)}
.sticky .st-text{flex:1;font-size:13px;line-height:1.5;word-break:break-word;cursor:pointer}
.sticky.done .st-text{text-decoration:line-through;color:var(--ink-3)}
.sticky .st-foot{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3)}
.sticky .st-del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);opacity:0;transition:.15s}
.sticky:hover .st-del{opacity:1}
.sticky .st-del:hover{background:rgba(0,0,0,.06);color:var(--red)}
.qa{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;
  padding:6px 8px 6px 12px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.qa input{flex:1;border:none;background:none;font-size:13.5px;min-width:0}
.qa .plus{width:26px;height:26px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.qa button.add{height:30px;padding:0 14px;border-radius:999px;background:var(--purple);color:#fff;font-weight:600;font-size:12.5px}

.mask{position:fixed;inset:0;background:rgba(20,12,40,.4);z-index:60;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.mask.show{display:flex}
.modal{width:100%;max-width:520px;max-height:90vh;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal .m-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal .m-head h3{font-size:15px;font-weight:600;flex:1}
.modal .m-head .x{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.modal .m-body{padding:18px;overflow-y:auto}
.modal .m-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:#fff;color:var(--ink)}
.field textarea{height:auto;min-height:74px;padding:9px 11px;resize:vertical;line-height:1.5}
.field .hint{font-size:11px;color:var(--ink-3);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink-2);font-weight:500}
.seg button.active{background:var(--purple);color:#fff;border-color:var(--purple)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(34,27,54,.92);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-md);animation:tin .2s ease}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

.note-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.note-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.12s}
.note-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.note-card h4{font-size:14px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.note-card .ex{font-size:12px;color:var(--ink-3);line-height:1.5;max-height:48px;overflow:hidden}
.note-card .nf{font-size:11px;color:var(--ink-3);margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.editor{border:1px solid var(--line);border-radius:10px;padding:12px;min-height:260px;outline:none;line-height:1.7;font-size:14px}
.editor:empty:before{content:attr(data-ph);color:var(--ink-3)}
.ed-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ed-toolbar button{width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink-2)}
.ed-toolbar button:hover{background:var(--purple-50);color:var(--purple-700)}

.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-3)}
.empty-act{margin-top:12px}
.banner{background:linear-gradient(135deg,var(--purple-50),#fff);border:1px solid var(--purple-200);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.banner .ic{color:var(--purple-700);flex:none;margin-top:1px}
.cat-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;font-size:13px}
.cat-item:hover{background:rgba(124,92,255,.06)}
.cat-item.active{background:var(--purple-100);color:var(--purple-700);font-weight:600}

@media(max-width:768px){
  .search{display:none}
  .topbar .hamb{display:flex}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-mask.show{display:block}
  .main{padding:14px}
  .sched{font-size:10px;gap:3px}
  .sched .sh,.sched .sd{padding:5px 2px}
  .hero .clock{font-size:38px}
  input,select,textarea{font-size:16px}
  .home-top,.home-portal{grid-template-columns:1fr !important}
}
/* ===== redesigned home: glass launcher + MSN-like portal ===== */
.launcher{background:rgba(255,255,255,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.65);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.launcher-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.launcher-head .ic{color:var(--purple-700)}
.launcher-title{font-size:15px;font-weight:700;color:var(--ink)}
.lpill{flex:none;display:inline-flex;align-items:center;padding:6px 13px;border-radius:999px;background:rgba(124,92,255,.1);color:var(--purple-700);font-size:12.5px;cursor:pointer;transition:.15s}
.lpill:active{background:rgba(124,92,255,.2)}
.chips-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:6px 14px;border-radius:999px;background:rgba(124,92,255,.08);color:var(--ink-2);font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s}

function nextClassInfo(){
  const sched=DB.get('schedule',[]),periods=DB.get('periods',[]),now=new Date();
  let best=null,cur=null;
  for(let d=0;d<7;d++){
    const day=new Date(now);day.setDate(now.getDate()+d);day.setHours(0,0,0,0);
    const dow=day.getDay();
    for(const s of sched.filter(x=>x.dow===dow)){
      const p=periods.find(x=>x.period===s.period);if(!p)continue;
      const [h,m]=p.start.split(':').map(Number);const [eh,em]=p.end.split(':').map(Number);
      const start=new Date(day);start.setHours(h,m,0,0);
      const end=new Date(day);end.setHours(eh,em,0,0);
      if(now>=start&&now<end){if(!cur||start>cur.start)cur={start,end,s,p,day};}
      if(start>now){if(!best||start<best.start)best={start,end,s,p,day,tomorrow:d===1,today:d===0};}
    }
  }
  return {best,cur};
}

function viewStudy(){
  if(!window._studyMonth){const n=new Date();window._studyMonth={y:n.getFullYear(),m:n.getMonth()};}

  const records=DB.get('study',[]);

  const activeCourses=courseNames.length;
  const thisWeek=records.filter(r=>{const d=parseDate(r.date);const now=new Date();const wkStart=new Date(now);wkStart.setDate(now.getDate()-now.getDay());return d>=wkStart;}).length;
  const memos=DB.get('memo',[]);
  const monthRecs=records.filter(r=>r.date&&r.date.slice(0,7)===y+'-'+pad(m+1));
  h+='<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">';

  h+='<div class="stat"><div class="v">'+memos.length+'</div><div class="k">备忘录条数</div></div>';

  h+='</div>';
  const first=new Date(y,m,1),startDow=first.getDay();const days=new Date(y,m+1,0).getDate();
  let cells='';for(let i=0;i<startDow;i++){const pd=new Date(y,m,1-i);cells+='<div class="cal-cell out">'+pd.getDate()+'</div>';}
  for(let d=1;d<=days;d++){const ds=y+'-'+pad(m+1)+'-'+pad(d);const recs=records.filter(r=>r.date===ds);let inner='';
    recs.slice(0,3).forEach(r=>{inner+='<div style="font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.course)+' '+r.progress+'%</div>';});
    if(recs.length>3)inner+='<div style="font-size:9px">+'+(recs.length-3)+'条</div>';
    cells+='<div class="cal-cell'+(ds===todayStr()?' today':'')+'" data-act="studyPick" data-d="'+ds+'">'+d+'<div style="margin-top:auto">'+inner+'</div></div>';
  }
  h+='<div class="card"><div class="cal-head"><span class="ic">'+ic('cal')+'</span><span class="mt">'+y+'年'+(m+1)+'月</span><div class="spacer"></div><button class="btn sm" data-act="studyPrev">'+ic('arrowL')+'</button><button class="btn sm" data-act="studyNext">'+ic('arrowR')+'</button></div>'+
    '<div class="cal-grid"><div class="cal-dow">日</div><div class="cal-dow">一</div><div class="cal-dow">二</div><div class="cal-dow">三</div><div class="cal-dow">四</div><div class="cal-dow">五</div><div class="cal-dow">六</div>'+cells+'</div></div>';
  const sd=window._studySel||todayStr();
  const dayRecs=records.filter(r=>r.date===sd);
  h+='<div class="grid" style="grid-template-columns:1.4fr 1fr">';
  h+='<div class="card"><div class="card-head"><span class="ic">'+ic('study')+'</span><h2>'+fmtDate(sd)+' 的学习</h2><div class="spacer"></div><button class="btn sm primary" data-act="addStudy" data-d="'+sd+'">'+ic('plus')+'</button></div>';
  if(!dayRecs.length)h+='<div class="empty">这天还没记录，点「+」记一次学习</div>';
  dayRecs.forEach(r=>{h+='<div class="task"><span class="tag">'+esc(r.course)+'</span><span class="t-title">进度 '+r.progress+'%</span><span class="t-meta">'+(r.note||'').slice(0,30)+'</span><span class="row-actions"><button data-act="delStudy" data-id="'+r.id+'">'+ic('del')+'</button></span></div>';});
  h+='</div>';
  h+='<div class="card"><div class="card-head"><span class="ic">'+ic('book')+'</span><h2>学习备忘录</h2></div><div class="qa"><input id="memoInput" placeholder="记一条要点，回车添加…" data-act="memoInput"><button class="add" data-act="addMemo">添加</button></div>';
  const ms=memos.slice().reverse();
  if(!ms.length)h+='<div class="empty">还没有备忘</div>';
  ms.forEach(m=>{h+='<div class="task"><span class="cbox'+(m.review?' done':'')+'" data-act="memoReview" data-id="'+m.id+'">'+(m.review?ic('check'):'')+'</span><span class="t-title">'+esc(m.text)+'</span><span class="row-actions"><button data-act="delMemo" data-id="'+m.id+'">'+ic('del')+'</button></span></div>';});

/* ===================== helpers ===================== */
function val(id){const e=$('#'+id);return e?e.value:'';}
function bindSeg(groupId,hiddenId){

  g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('button',g).forEach(x=>x.classList.remove('active'));b.classList.add('active');const h=$('#'+hiddenId);if(h)h.value=b.dataset.v;});
}
function blobDownload(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function csvEscape(s){s=String(s==null?'':s);if(/[",\n]/.test(s))return '"'+s.replace(/"/g,'""')+'"';return s;}
function exportCSV(name,headers,rows){
  let csv='\ufeff'+headers.join(',')+'\n';
  rows.forEach(r=>csv+=r.map(csvEscape).join(',')+'\n');
  blobDownload(new Blob([csv],{type:'text/csv;charset=utf-8'}),name);toast('已导出 '+name);
}
function moveToTrash(type,obj,summary){
  if(!obj)return;
  const trash=DB.get('trash',[]);
  trash.push({id:uid(),type,data:obj,summary,deletedAt:Date.now()});

}
function findById(arr,id){return arr.find(x=>x.id===id);}
function closeSb(){$('#sidebar').classList.remove('open');$('#sbMask').classList.remove('show');}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));}else fallbackCopy(t);}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();}

/* ===================== EVENT DELEGATION ===================== */
function handleAct(act,el,e){
  const id=el.dataset.id;

    case 'nav':go(el.dataset.target);closeSb();break;
    case 'catChip':launcherCat=el.dataset.cat;renderLauncher();break;
    case 'toggleSb':$('#sidebar').classList.toggle('open');$('#sbMask').classList.toggle('show');break;
    case 'closeSb':closeSb();break;
    case 'toggleGroup':toggleGroup(el.dataset.g);break;
    case 'closeModal':closeModal();break;
    case 'confirmYes':{closeModal();if(pendingConfirm){pendingConfirm.onYes();pendingConfirm=null;}break;}
    case 'toggleRemind':{const s=DB.get('settings',{});s.remind=!s.remind;DB.set('settings',s);render();toast(s.remind?'课前提醒已开启':'课前提醒已关闭');break;}

    case 'addTaskQuick':{const inp=$('#qaTask');const v=inp?inp.value.trim():'';if(!v){taskModal();break;}const list=DB.get('tasks',[]);list.push({id:uid(),title:v,date:todayStr(),time:'',cat:'',repeat:'once',done:false,doneMap:{},createdAt:Date.now()});DB.set('tasks',list);if(inp)inp.value='';renderTaskCard();renderTodayCard();renderCalCard();toast('已添加');break;}

    case 'delAlarm':{const a=DB.get('alarms',[]);DB.set('alarms',a.filter(x=>x.id!==id));renderAlarmCard();break;}
    case 'calPrev':{const m=window._calMonth;m.m--;if(m.m<0){m.m=11;m.y--;}window._calMonth=m;renderCalCard();break;}
    case 'calNext':{const m=window._calMonth;m.m++;if(m.m>11){m.m=0;m.y++;}window._calMonth=m;renderCalCard();break;}
    case 'calPick':{window._calSel=el.dataset.d;renderCalCard();break;}
    case 'calAdd':{taskModal(null,el.dataset.d);break;}
    case 'addCourse':courseModal();break;
    case 'cellAdd':{courseModal({dow:+el.dataset.dow,period:+el.dataset.period});break;}
    case 'editCourse':{const c=findById(DB.get('schedule',[]),id);courseModal(c);break;}
    case 'saveCourse':saveCourse(el.dataset.id);break;
    case 'delCourse':{confirmDialog('删除该课程？',()=>{DB.set('schedule',DB.get('schedule',[]).filter(s=>s.id!==id));closeModal();render();toast('已删除');});break;}
    case 'addClass':classModal();break;
    case 'editClass':classModal(findById(DB.get('classes',[]),id));break;
    case 'saveClass':saveClass(el.dataset.id);break;
    case 'delClass':{confirmDialog('删除该上课记录？',()=>{const list=DB.get('classes',[]);const c=findById(list,id);moveToTrash('上课记录',c,(c.date||'')+' '+c.course);DB.set('classes',list.filter(x=>x.id!==id));closeModal();render();toast('已移到回收站');});break;}
    case 'classFilter':DB.set('classFilter',el.dataset.v);render();break;
    case 'seatCheck':{const seat=DB.get('seat',{rows:seatRows(54)});if(!seat.rows)seat.rows=seatRows(54);const r=seat.rows.find(x=>x.id==id);if(r){r.checked=!r.checked;DB.set('seat',seat);renderSeat();}break;}
    case 'researchGrade':DB.set('researchGrade',el.dataset.g);$$('.chip',el.parentElement).forEach(x=>x.classList.remove('active'));el.classList.add('active');renderResearch();break;
    case 'researchCheck':{const g=el.dataset.g;const data=DB.get('research',{})[g]||researchDefault(g);const r=data.rows.find(x=>x.id==id);if(r){r.checked=!r.checked;r.time=r.checked?nowHM():'';const all=DB.get('research',{});all[g]=data;DB.set('research',all);renderResearch();}break;}
    case 'attExport':{const seat=DB.get('seat',{rows:seatRows(54)});exportCSV('考勤-坐班表.csv',['编号','姓名','坐班'],seat.rows.map(r=>[r.id,r.name,r.checked?'是':'否']));break;}
    case 'bookCat':DB.set('bookCat',el.dataset.c);render();break;
    case 'addCat':{openModal('新增分类','<div class="field"><label>分类名称</label><input id="fCatName" placeholder="如 习题"></div>','<button class="btn ghost" data-act="closeModal">取消</button><button class="btn primary" data-act="saveCat">保存</button>');break;}
    case 'saveCat':{const c=val('fCatName').trim();if(!c)break;const cats=DB.get('cats',[]);cats.push(c);DB.set('cats',cats);closeModal();render();toast('已添加分类');break;}
    case 'addBook':addBookModal();break;
    case 'saveBook':saveBook();break;
    case 'genShare':genShare();break;
    case 'downBook':{const b=findById(DB.get('textbooks',[]),id);if(b){b.downloads=(b.downloads||0)+1;const arr=DB.get('textbooks',[]);const i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]=b;DB.set('textbooks',arr);toast('已记录一次下载（静态站无真实文件）');render();}break;}
    case 'copyBookLink':{const b=findById(DB.get('textbooks',[]),id);const link=location.origin+location.pathname+'#textbooks';copyText(link);toast('已复制教材页链接（演示）');break;}
    case 'delBook':{confirmDialog('删除该教材记录？',()=>{const list=DB.get('textbooks',[]);const b=findById(list,id);moveToTrash('教材',b,b.name);DB.set('textbooks',list.filter(x=>x.id!==id));render();toast('已移到回收站');});break;}
    case 'addTravel':travelModal();break;
    case 'editTravel':travelModal(findById(DB.get('travel',[]),id));break;
    case 'saveTravel':saveTravel(el.dataset.id);break;
    case 'delTravel':{confirmDialog('删除该出差记录？',()=>{const list=DB.get('travel',[]);const t=findById(list,id);moveToTrash('出差',t,t.dest);DB.set('travel',list.filter(x=>x.id!==id));closeModal();render();toast('已移到回收站');});break;}
    case 'addInvig':invigModal();break;
    case 'editInvig':invigModal(findById(DB.get('invig',[]),id));break;
    case 'saveInvig':saveInvig(el.dataset.id);break;
    case 'delInvig':{confirmDialog('删除该监考记录？',()=>{const list=DB.get('invig',[]);const t=findById(list,id);moveToTrash('监考',t,'');DB.set('invig',list.filter(x=>x.id!==id));closeModal();render();toast('已移到回收站');});break;}
    case 'addNote':DB.set('noteEdit',{id:uid(),title:'',body:'',perm:'private'});render();break;
    case 'openNote':openNote(id);break;
    case 'closeNote':DB.del('noteEdit');render();break;
    case 'saveNote':{const body=$('#nBody')?$('#nBody').innerHTML:'';const title=val('nTitle')||'无标题';const perm=val('nPermVal')||'private';const notes=DB.get('notes',[]);const e=DB.get('noteEdit');if(e&&e.id){const i=notes.findIndex(x=>x.id===e.id);if(i>=0)notes[i]={...notes[i],title,body,perm,updatedAt:Date.now(),words:stripHtml(body).length};else notes.push({id:e.id,title,body,perm,updatedAt:Date.now(),words:stripHtml(body).length,visits:0,downloads:0});}else notes.push({id:uid(),title,body,perm,updatedAt:Date.now(),words:stripHtml(body).length,visits:0,downloads:0});DB.set('notes',notes);DB.del('noteEdit');render();toast('已保存');break;}
    case 'delNote':{confirmDialog('删除该笔记？',()=>{const notes=DB.get('notes',[]);const n=findById(notes,id);moveToTrash('笔记',n,n.title);DB.set('notes',notes.filter(x=>x.id!==id));DB.del('noteEdit');closeModal();render();toast('已移到回收站');});break;}
    case 'edCmd':{const ed=$('#nBody');if(!ed)break;ed.focus();if(el.dataset.cmd==='createLink'){const u=prompt('输入链接地址：','https://');if(u)document.execCommand('createLink',false,u);}else if(el.dataset.val){document.execCommand(el.dataset.cmd,false,el.dataset.val);}else document.execCommand(el.dataset.cmd,false,null);updateWords();break;}
    case 'addStudy':studyModal(el.dataset.d);break;
    case 'saveStudy':saveStudy();break;
    case 'delStudy':{confirmDialog('删除该学习记录？',()=>{const list=DB.get('study',[]);const r=findById(list,id);moveToTrash('学习记录',r,'');DB.set('study',list.filter(x=>x.id!==id));render();toast('已移到回收站');});break;}
    case 'studyPick':window._studySel=el.dataset.d;render();break;
    case 'studyPrev':{const m=window._studyMonth;m.m--;if(m.m<0){m.m=11;m.y--;}window._studyMonth=m;render();break;}
    case 'studyNext':{const m=window._studyMonth;m.m++;if(m.m>11){m.m=0;m.y++;}window._studyMonth=m;render();break;}
    case 'addMemo':{const inp=$('#memoInput');const v=inp?inp.value.trim():'';if(!v)break;const ms=DB.get('memo',[]);ms.push({id:uid(),text:v,review:false,createdAt:Date.now()});DB.set('memo',ms);render();break;}
    case 'memoInput':if(e&&e.key==='Enter'){const inp=$('#memoInput');const v=inp?inp.value.trim():'';if(v){const ms=DB.get('memo',[]);ms.push({id:uid(),text:v,review:false,createdAt:Date.now()});DB.set('memo',ms);inp.value='';render();}}break;
    case 'memoReview':{const ms=DB.get('memo',[]);const x=findById(ms,id);if(x){x.review=!x.review;DB.set('memo',ms);render();}break;}
    case 'delMemo':{const ms=DB.get('memo',[]);DB.set('memo',ms.filter(x=>x.id!==id));render();break;}
    case 'addSticky':{const inp=$('#qaSticky');const v=inp?inp.value.trim():'';if(!v){if(inp)inp.focus();break;}const list=DB.get('stickies',[]);list.push({id:uid(),text:v,color:Math.floor(Math.random()*5),done:false,createdAt:Date.now()});DB.set('stickies',list);if(inp)inp.value='';render();toast('已贴上');break;}
    case 'qaStickyInput':if(e&&e.key==='Enter'){const inp=$('#qaSticky');const v=inp?inp.value.trim():'';if(v){const list=DB.get('stickies',[]);list.push({id:uid(),text:v,color:Math.floor(Math.random()*5),done:false,createdAt:Date.now()});DB.set('stickies',list);inp.value='';render();}}break;
    case 'toggleSticky':{const list=DB.get('stickies',[]);const s=findById(list,id);if(s){s.done=!s.done;DB.set('stickies',list);render();}break;}
    case 'delSticky':{confirmDialog('删除该便签？',()=>{const list=DB.get('stickies',[]);const s=findById(list,id);moveToTrash('便签',s,s.text);DB.set('stickies',list.filter(x=>x.id!==id));render();toast('已移到回收站');});break;}
    case 'stickyFilter':DB.set('stickyFilter',el.dataset.v);render();break;
    case 'saveProfile':{const p=DB.get('profile',{});p.name=val('pName');p.group=val('pGroup');DB.set('profile',p);render();toast('已保存');break;}
    case 'exportData':{const keys=['periods','schedule','profile','tasks','stickies','classes','travel','invig','notes','study','memo','alarms','textbooks','cats','trash','settings','seat','research','researchGrade'];const dump={};keys.forEach(k=>dump[k]=DB.get(k));blobDownload(new Blob([JSON.stringify(dump,null,2)],{type:'application/json'}),'我的工作台-数据备份.json');toast('已导出数据备份');break;}
    case 'importData':{const f=$('#importFile');if(f)f.click();break;}
    case 'importFilePick':{const f=el.files[0];if(!f)break;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);Object.keys(d).forEach(k=>DB.set(k,d[k]));loadState();render();toast('导入成功');}catch(err){toast('导入失败：文件格式错误');}};rd.readAsText(f);break;}
    case 'clearData':{confirmDialog('确定清空全部本地数据？此操作不可撤销！',()=>{['periods','schedule','profile','tasks','stickies','classes','travel','invig','notes','study','memo','alarms','textbooks','cats','trash','settings','seat','research','researchGrade'].forEach(k=>DB.del(k));initData();loadState();render();toast('已清空并重置');});break;}
    case 'restoreItem':{const trash=DB.get('trash',[]);const t=findById(trash,id);if(!t)break;const map={任务:'tasks',上课记录:'classes',出差:'travel',监考:'invig',笔记:'notes',学习记录:'study',便签:'stickies',教材:'textbooks'};const key=map[t.type];if(key){const arr=DB.get(key,[]);if(arr&&!arr.find(x=>x.id===t.data.id))arr.push(t.data);DB.set(key,arr);}DB.set('trash',trash.filter(x=>x.id!==id));render();toast('已恢复');break;}
    case 'purgeItem':{confirmDialog('彻底删除该记录？不可恢复。',()=>{DB.set('trash',DB.get('trash',[]).filter(x=>x.id!==id));render();toast('已彻底删除');});break;}
    case 'emptyTrash':{confirmDialog('清空回收站？所有记录将彻底删除。',()=>{DB.set('trash',[]);render();toast('回收站已清空');});break;}
    case 'search':break;
    default:console.log('未处理动作:',act);
  }
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  handleAct(el.dataset.act,el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const el=e.target;
    if(el&&el.dataset&&el.dataset.act&&['qaTaskInput','qaStickyInput','memoInput'].includes(el.dataset.act)){handleAct(el.dataset.act,el,e);}
  }
  if(e.key==='Escape'){closeModal();closeSb();}
});
$('#modalMask').addEventListener('click',e=>{if(e.target.id==='modalMask')closeModal();});

/* ===================== INIT ===================== */
function init(){
  initData();loadState();renderSidebar();
  window.addEventListener('hashchange',render);
  const gs=$('#globalSearch');if(gs)gs.addEventListener('keydown',e=>{if(e.key==='Enter'){const q=gs.value.trim();if(q){toast('已切到首页，可在首页/日历查找「'+q+'」');go('home');}}});
  render();
}
init();
</script>
</body>
</html>
