<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>教师个人工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="教师个人工作台">
<meta name="theme-color" content="#f2f2f7">
<!-- Cloudflare Pages 的随机预览域名没有原固定测试域名的本地登录态。
     在应用读取 localStorage / Supabase session 之前，统一回到固定测试域名，
     避免显示成未登录的默认用户，也避免用户误以为个人资料丢失。 -->
<script>
  (function () {
    var host = String(location.hostname || '').toLowerCase();
    if (/^[0-9a-f]{8}\.my-workbench-test\.pages\.dev$/.test(host)) {
      var target = new URL(location.href);
      target.protocol = 'https:';
      target.hostname = 'my-workbench-test.pages.dev';
      target.port = '';
      location.replace(target.href);
    }
  })();
</script>
<!-- 相对路径必须带 ./ ：线上挂在 /my-workbench/ 子路径下，
     href="manifest.webmanifest" 会被解析成 /manifest.webmanifest → 404，
     结果是「添加到主屏幕」拿不到图标和名称。 -->
<link rel="manifest" href="./manifest.webmanifest">
<!-- 补一个 favicon 声明：不写这一行，浏览器会自动请求 /favicon.ico，
     而本仓库没有这个文件，控制台就常驻一条 404，排查真问题时容易误判。 -->
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/teacher-ui.css">
<link rel="stylesheet" href="css/auth-redesign.css">
<link rel="stylesheet" href="css/attendance-workspace.css">
<link rel="stylesheet" href="css/attendance-prd.css">
<link rel="stylesheet" href="css/workbench-unified.css">
<link rel="stylesheet" href="css/timetable-redesign.css">
<script>
  (function () {
    try {
      var OK = ['light', 'dark', 'green', 'warm', 'pink', 'ocean'];
      var META = { light: '#f2f2f7', dark: '#000000', green: '#eaf2ea', warm: '#f7f1e6', pink: '#fbf0f4', ocean: '#eaf3f8' };
      var t = localStorage.getItem('wb_theme');
      try { t = JSON.parse(t); } catch (e) {}
      if (OK.indexOf(t) < 0) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      var m = document.querySelector('meta[name=theme-color]');
      if (m && META[t]) m.content = META[t];
    } catch (e) {}
  })();
</script>
</head>
<body>
<script>
  /* localhost 开发环境清理历史 PWA 接管：必须放在主模块之前执行，
     防止旧 Service Worker 把本地入口页和 JS 请求送进旧缓存。 */
  (function () {
    if (!['localhost', '127.0.0.1'].includes(location.hostname) || !('serviceWorker' in navigator)) return;
    navigator.serviceWorker.getRegistrations()
      .then(function (regs) { return Promise.all(regs.map(function (reg) { return reg.unregister(); })); })
      .then(function () {
        if (!navigator.serviceWorker.controller) return;
        var key = 'wb_local_sw_released';
        if (sessionStorage.getItem(key) === '1') return;
        sessionStorage.setItem(key, '1');
        location.reload();
      })
      .catch(function (e) { console.warn('[sw] 本地开发环境清理旧注册失败', e); });
  })();
</script>
<div id="app"></div>
<div id="alarm-root"></div>
<script>
  /* TEST 启动前更新检查：即使旧 JS 模块无法加载，也能先发现并激活新版 SW。 */
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var hadController = !!navigator.serviceWorker.controller;
    var reloadKey = 'wb_sw_controller_reloaded';
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController) return;
      try {
        if (sessionStorage.getItem(reloadKey) === '1') return;
        sessionStorage.setItem(reloadKey, '1');
      } catch (e) { return; }
      location.reload();
    });
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(function (registration) { return registration.update(); })
      .catch(function (error) { console.warn('[sw] 启动前更新检查失败', error); });
  })();
</script>
<script type="module" src="js/main.js"></script>
<script>
  /* 【加载失败兜底：别让人对着一片空白】
     这个站点是静态页 + ES Module。只要 js/main.js 因为网络卡住、
     或者浏览器里存着过期的 module 缓存没拉下来，页面上就只剩一个空的 #app，
     用户看到的就是纯灰白 —— 分不清是「坏了」还是「在加载」。
     这里做两件事：
       1) 4 秒后还没渲染出内容，就把 #app 撑起来显示「正在加载…」；
       2) 12 秒还没好，改成「加载失败 + 重新加载按钮」，并自动重试一次。
     正常的快网络下这两段都不会触发，用户看不到任何多余的东西。 */
  (function () {
    var app = document.getElementById('app');
    var t1, t2, tried = 0;
    function box(text, showBtn) {
      if (!app) return;
      app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;'
        + 'font-family:-apple-system,\'PingFang SC\',\'Microsoft YaHei\',sans-serif;padding:24px;box-sizing:border-box">'
        + '<div style="max-width:340px;text-align:center">'
        + '<div style="width:52px;height:52px;border-radius:15px;margin:0 auto 16px;display:grid;place-items:center;'
        + 'background:linear-gradient(135deg,#4f6ef7,#7b5cf0);color:#fff;font-size:22px;font-weight:700">台</div>'
        + '<div style="font-size:15px;color:#2a2f3a;line-height:1.7">' + text + '</div>'
        + (showBtn ? '<button onclick="location.reload()" style="margin-top:18px;width:100%;height:44px;border:0;'
            + 'border-radius:12px;background:#4f6ef7;color:#fff;font-size:15px;font-weight:600;'
            + 'font-family:inherit;cursor:pointer">重新加载</button>' : '')
        + '</div></div>';
    }
    function rendered() {
      return app && app.children.length > 0 && app.innerText.trim().length > 20;
    }
    function showStartupError(message) {
      if (rendered()) return;
      var detail = String(message || '未知启动错误').slice(0, 220);
      box('工作台启动遇到问题<br><span style="font-size:12px;color:#8b93a3">'
        + detail.replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; })
        + '</span>', true);
      console.error('[startup] 页面启动失败：', message);
    }
    window.addEventListener('error', function (event) {
      if (event && (event.message || (event.target && event.target.tagName === 'SCRIPT'))) {
        showStartupError(event.message || ('脚本加载失败：' + (event.target.src || '未知模块')));
      }
    }, true);
    window.addEventListener('unhandledrejection', function (event) {
      var reason = event && event.reason;
      showStartupError(reason && (reason.message || reason) || '异步初始化失败');
    });
    window.addEventListener('wb:booted', function () {
      clearTimeout(t1);
      clearTimeout(t2);
    });
    t1 = setTimeout(function () {
      if (!rendered()) box('正在加载…', false);
    }, 5000);
    t2 = setTimeout(function () {
      if (rendered()) return;
      box('页面没能加载出来<br>多半是网络卡了一下，或者浏览器里存着旧版本。', true);
      /* 不要自动刷新：云端超时期间刷新会重复触发账户初始化请求，
         造成请求风暴。让用户手动点击重试，避免放大 Supabase 压力。 */
    }, 30000);
    /* main.js 自己跑通了会调用 window.__wbBooted */
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (rendered()) { clearTimeout(t1); clearTimeout(t2); }
      }, 800);
    });
  })();
</script>
</body>
</html>
