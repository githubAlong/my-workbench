  const local = await localHandle(method, path, ctx.query, ctx.body).catch(() => null);
  if (local?.ok) return local.data;
  /* 本地失败（常见于外网独立访问，没有老师的 localStorage），走云端 */
  try { return await callCloudStudent(method, path, ctx.query, ctx.body); }
  catch (cloudErr) { throw new Error(local?.error || cloudErr.message || '加载失败'); }
};
/* 记住我是谁：学号/姓名存本地，下次自动带出 */
const ME_KEY = 'wb_stu_' + code;

const remember = (v) => { try { localStorage.setItem(ME_KEY, JSON.stringify(v)); } catch {} };
/* 班级名拼接：库里存的常是"高二(5)班"，年级也是"高二"，直接拼会重复成"高二 高二(5)班" */
function clsName(grade, cls) {
  const g = String(grade || '').trim();
  const c = String(cls || '').trim();
  if (!g) return c;
  if (!c) return g;
  return c.startsWith(g) ? c : g + ' ' + c;
}

let cur = null;

const savePref = (k, v) => { try { localStorage.setItem(PREF_KEY, JSON.stringify({ ...prefs(), [k]: v })); } catch {} };
function myClass() {

const todayStr = () => {

/* 老师在「教材 / 点名 / 盲盒」页里可以逐个关掉学生端模块；
   自习没有单独的开关，发布了任务就相当于这个模块存在。
   全部关掉且没有任务/签到时，整页只显示「正在来的路上」。 */
function visibleTabs() {
  const mods = data?.link?.modules || {};
  const on = (k) => Number(mods[k]) !== 0;
  const list = [];
  if ((data?.selfstudyTasks || []).length) list.push('selfstudy');
  if (data?.roll && data.roll.length) list.push('checkin');
  if (on('material')) list.push('material');
  if (on('roll')) list.push('roll');
  if (on('punish')) list.push('punish');
  if (on('misconduct')) list.push('misconduct');
  if (on('bulletin')) list.push('bulletin');

}

/* 资料口令记在 sessionStorage（不是 localStorage）：
   班里共用一台电脑时，localStorage 会把第一个学生输的口令永久留给后面所有人，
   关掉标签页就作废才符合「这个班的口令只在这节课有效」。 */
const PC_KEY = 'wb_stu_pc_' + code;
const unlockedMats = () => { try { return JSON.parse(sessionStorage.getItem(PC_KEY) || '{}'); } catch { return {}; } };
const passcodeFor = (id) => String(unlockedMats()[id] || '');
const rememberPasscode = (id, value) => { try { sessionStorage.setItem(PC_KEY, JSON.stringify({ ...unlockedMats(), [id]: value })); } catch {} };
const forgetPasscode = (id) => { const all = unlockedMats(); delete all[id]; try { sessionStorage.setItem(PC_KEY, JSON.stringify(all)); } catch {} };
/* 列表只说「这份要不要口令」，真开不开得起来由服务端判：
   所以这里点进去先探一次详情，口令缺失就直接弹输入框，不去猜本地那份准不准。 */
function openMaterial() {
  const m = (data.materials || []).find((x) => String(x.id) === String(cur));
  if (m?.locked && !passcodeFor(cur)) return paintPasscodeGate();
  return paintMaterialDetail();
}
function paintMaterials() {
  if (cur) return openMaterial();

  </div>`;

/* 口令输错只改这一行字，不重画整块：重画会把学生已经输入的内容抹掉。 */
function paintPasscodeGate(tip) {
  const m = (data.materials || []).find((x) => String(x.id) === String(cur)) || {};
  $('#s-body').innerHTML = `<div class="card card-pad">
    <button class="btn ghost sm" id="pc-back">‹ 返回列表</button>
    <div class="pc-em">${ICON.lock}</div>
    <h2 style="margin:4px 0 4px;font-size:18px">${esc(m.title || '这份资料')}</h2>
    <div class="tiny muted">老师给这份资料设了班级口令，输入正确才能查看和下载。</div>
    <div class="field" style="margin-top:14px"><label class="field-label" for="pc-in">班级口令</label>
      <input class="input" id="pc-in" type="text" autocomplete="off" spellcheck="false" placeholder="输入老师给的口令"></div>
    <div class="tiny" id="pc-msg" style="color:var(--red);margin-top:8px" hidden></div>
    <button class="btn primary block" id="pc-go" style="margin-top:12px">打开资料</button>
  </div>`;
  const say = (msg) => { const tipEl = $('#pc-msg'); tipEl.textContent = msg; tipEl.hidden = !msg; };
  say(tip || '');
  $('#pc-back').onclick = () => { cur = null; paint(); };
  const input = $('#pc-in'), go = $('#pc-go');
  const submit = async () => {
    const value = input.value.trim();
    if (!value) return say('请先输入口令');
    go.disabled = true;
    go.textContent = '校验中…';
    try {
      /* 口令对不对由服务端说了算：这里真取一次详情，取到了才算解锁。 */
      await api(`/public/link/${code}/materials/${cur}?passcode=${encodeURIComponent(value)}`);
      rememberPasscode(cur, value);
      paintMaterialDetail();
    } catch (e) {
      forgetPasscode(cur);
      say(e?.needPasscode ? '口令不对，找老师再确认一下' : (e.message || '打开失败，请稍后重试'));
      go.disabled = false;
      go.textContent = '打开资料';
      input.focus();
    }
  };
  go.onclick = submit;
  input.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  input.focus();
}
/* 学生端能预览的类型。docx 由 mammoth 在本地转成网页（不走外网），
   其余（xlsx / pptx / zip…）浏览器渲染不了：
   以前点一下会新开空白页，再把 octet-stream 的 blob 当页面打开，
   结果存成一个没有扩展名的 UUID 文件，下载完谁也打不开。
   现在能预览的在页面内预览，不能预览的按原文件名下载。 */
const PREVIEW_KIND = {
  pdf: 'pdf', docx: 'docx',
  png: 'image', jpg: 'image', jpeg: 'image', gif: 'image', webp: 'image', bmp: 'image', svg: 'image',
  mp4: 'video', webm: 'video', ogv: 'video',
  mp3: 'audio', m4a: 'audio', wav: 'audio', ogg: 'audio',
};
const previewKind = (name) => PREVIEW_KIND[String(name || '').split('.').pop().toLowerCase()] || '';

/* mammoth 只在真的打开 docx 时才加载：每个学生一进页面就多下 600KB 不值得。
   放在 assets/ 下而不是 js/，因为 js/ 会被 Service Worker 全量预缓存。 */
let mammothLoading = null;
function loadMammoth() {
  if (window.mammoth) return Promise.resolve(window.mammoth);
  if (!mammothLoading) {
    mammothLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = './assets/vendor/mammoth.browser.min.js';
      s.onload = () => (window.mammoth ? resolve(window.mammoth) : reject(new Error('文档解析组件不可用')));
      s.onerror = () => { mammothLoading = null; reject(new Error('文档解析组件加载失败，请检查网络')); };
      document.head.appendChild(s);
    });
  }
  return mammothLoading;
}
/* 文档内容来自上传的文件，渲染前去掉脚本类标签和内联事件，避免变成可执行页面。 */
function sanitizeDoc(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  tpl.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach((n) => n.remove());
  tpl.content.querySelectorAll('*').forEach((n) => {
    for (const attr of [...n.attributes]) {
      const name = attr.name.toLowerCase();
      if (name.startsWith('on')) n.removeAttribute(attr.name);
      else if ((name === 'href' || name === 'src') && /^\s*javascript:/i.test(attr.value)) n.removeAttribute(attr.name);
    }
  });
  return tpl.innerHTML;
}
async function paintMaterialDetail() {
  $('#s-body').innerHTML = '<div class="card card-pad small muted">加载中…</div>';
  const passcode = passcodeFor(cur);

    $('#s-body').innerHTML = `<div class="card card-pad">

      <h2 style="margin:12px 0 4px;font-size:19px">${esc(d.material.title)}</h2>

      <div class="col" style="margin-top:14px">
        ${d.files.length ? d.files.map((f) => {
          const kind = previewKind(f.name);
          return `<button class="btn ghost block" data-file="${f.id}" data-name="${esc(f.name)}" data-kind="${kind}" style="justify-content:flex-start;gap:10px">
            <span style="flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis">${esc(f.name)}</span>
            <span class="tiny muted">${kind ? '预览' : '下载'} · ${(f.size / 1024 / 1024).toFixed(1)} MB</span></button>`;
        }).join('')
          : '<div class="muted small">这份资料还没有文件</div>'}
      </div>
      <div class="row wrap" style="gap:8px;margin-top:14px">
        ${d.files.map((f) => `<button class="btn soft sm" data-dl="${f.id}" data-name="${esc(f.name)}">${ICON.dl} 下载 ${esc(f.name).slice(0, 12)}</button>`).join('')}
      </div>
      <div class="tiny muted" style="margin-top:14px">PDF、图片、音视频和 Word 文档点开即可在线预览；Excel / PPT 等格式浏览器无法预览，点击会按原文件名下载。</div>
    </div>`;
    /* 不能直接给 href 让浏览器跳转：文件地址在云端函数上，顶层导航会撞上 ngrok 提示页，
       跨域时 download 属性也会被忽略。先 fetch 成 blob 再预览或保存。 */
    let pvURL = '';
    const loadBlob = async (id, mode) => {
      /* 口令放请求头再取文件：URL 会原样进服务端访问日志，不该带口令。
         服务端不认就直接 401，一个字节都拿不到。 */
      const res = await fetch(materialEndpoint(code, cur, id, mode), { headers: passcodeHeaders(passcodeFor(cur)) }).catch(() => null);
      if (!res) throw new Error('文件暂时打不开，请稍后重试');
      if (res.status === 401) { forgetPasscode(cur); throw new Error('口令已失效，请重新输入'); }
      if (!res.ok) throw new Error('文件暂时打不开，请稍后重试');
      return res.blob();
    };
    /* 不能预览的类型直接下载：保留原文件名，否则浏览器会把 blob 存成一串 UUID */
    const saveAs = async (btn, id, name) => {
      const label = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = '下载中…';
      try {
        const href = URL.createObjectURL(await loadBlob(id, 'download'));
        const a = document.createElement('a');
        a.href = href; a.download = name || '教材文件';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(href), 10000);
        btn.textContent = '已开始下载';
        setTimeout(() => { btn.innerHTML = label; }, 1800);
      } catch (e) {
        btn.textContent = e.message;
        setTimeout(() => { btn.innerHTML = label; }, 2400);
      }
      btn.disabled = false;
    };
    /* 预览放在当前页里，不新开窗口：新窗口会先显示 about:blank，
       手机上也容易被弹窗拦截。 */
    const showPreview = async (btn, id, name, kind) => {
      const label = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = '加载中…';
      try {
        const blob = await loadBlob(id, 'view');
        if (pvURL) URL.revokeObjectURL(pvURL);
        pvURL = URL.createObjectURL(blob);
        const media = kind === 'image' ? `<img src="${pvURL}" alt="${esc(name)}">`
          : kind === 'video' ? `<video src="${pvURL}" controls playsinline preload="metadata"></video>`
            : kind === 'audio' ? `<audio src="${pvURL}" controls preload="metadata"></audio>`
              : kind === 'docx' ? '<div class="pv-doc" id="pv-doc">正在解析文档…</div>'
                : `<iframe src="${pvURL}" title="${esc(name)}"></iframe>`;
        $('#s-body').innerHTML = `<div class="card card-pad">
          <div class="row wrap" style="gap:8px">
            <button class="btn ghost sm" id="pv-back">‹ 返回资料</button>
            <span style="flex:1"></span>
            <button class="btn soft sm" id="pv-dl">${ICON.dl} 下载原文件</button>
          </div>
          <h2 style="margin:12px 0 4px;font-size:16px;word-break:break-all">${esc(name)}</h2>
          <div class="pv-wrap">${media}</div>
        </div>`;
        $('#pv-back').onclick = () => {
          if (pvURL) { URL.revokeObjectURL(pvURL); pvURL = ''; }
          paintMaterialDetail();
        };
        $('#pv-dl').onclick = () => {
          const a = document.createElement('a');
          a.href = pvURL; a.download = name || '教材文件';
          document.body.appendChild(a); a.click(); a.remove();
        };
        if (kind === 'docx') {
          try {
            const mammoth = await loadMammoth();
            const out = await mammoth.convertToHtml({ arrayBuffer: await blob.arrayBuffer() });
            const box = document.getElementById('pv-doc');
            if (box) box.innerHTML = sanitizeDoc(out.value || '<p>（文档内容为空）</p>');
          } catch (err) {
            const box = document.getElementById('pv-doc');
            if (box) box.innerHTML = `<p class="muted">文档解析失败：${esc(err.message)}。可以点右上角「下载原文件」。</p>`;
          }
        }
      } catch (e) {
        btn.disabled = false;
        btn.textContent = e.message;
        setTimeout(() => { btn.innerHTML = label; }, 2400);
      }
    };
    document.querySelectorAll('[data-file]').forEach((b) => {
      b.onclick = () => {
        if (b.dataset.kind) showPreview(b, b.dataset.file, b.dataset.name, b.dataset.kind);
        else saveAs(b, b.dataset.file, b.dataset.name);
      };
    });
    document.querySelectorAll('[data-dl]').forEach((b) => { b.onclick = () => saveAs(b, b.dataset.dl, b.dataset.name); });
    document.getElementById('back').onclick = () => { cur = null; paint(); };
  } catch (e) {
    /* 老师中途改过口令：本机记的那份已经作废，回到输入框重新要一次。 */
    if (e?.needPasscode) { forgetPasscode(cur); return paintPasscodeGate('这份资料需要口令，请先输入'); }
    $('#s-body').innerHTML = `<div class="card card-pad">${esc(e.message)}</div>`;
  }
}
/* ---------- 点名：选班级 → 点一下 → 滚出名字 ---------- */
const ROLL_ME = 'wb_pick_';
function paintRoll() {
  /* 【第 19 条】以前这里有一道硬拦截：没有班级名单就直接「老师还没有设置班级名单」，
     整页什么都不给。可老师最常见的用法恰恰是「报个班号，从 1 号点到 50 号」——
     根本不需要名单。名单现在只是「按名字点」这个可选项的数据来源，
     没有名单就默认走按号码，页面照常可用。 */
  const rosters = data.rosters || [];
  const liveCls = (data.roll && data.roll[0]) || null;
  const first = (liveCls && rosters.find((r) => String(r.id) === String(liveCls.roster_id)))
    || rosters[0]
    || { id: 0, grade: '', class_name: '', names: [], count: 0 };
  /* 【第 19 条：点名改成填人数 + 点几个，按号码点】
     原来只能从老师预置的名单里选班，名单没建就没得点；
     「同时点 N 人」藏在右上角一个不起眼的数字框里；点的永远是名字。
     老师实际用法通常是：随便报个班号，从 1 号点到 50 号，点 3 个。
     现在只填人数和点几个，默认按号码点；班级和最近常用班已按反馈去掉，
     姓名模式退化为使用老师当前名单（有名单时可选）。 */
  const names0 = (first.names || []).filter(Boolean);
  const hasNames = names0.length > 0;
  const cnt0 = Math.max(1, Math.min(200, Number(first.count) || first.roster_count || names0.length || 40));

  $('#s-body').innerHTML = `<div class="card card-pad">
    <div class="pk-grid">
      <div class="field"><label class="field-label">人数</label>
        <input class="input" id="pk-total" type="number" inputmode="numeric" min="1" max="200" value="${cnt0}"></div>
      <div class="field"><label class="field-label">点几个</label>
        <input class="input" id="pk-num" type="number" inputmode="numeric" min="1" max="20" value="1"></div>
    </div>
    <div class="field" style="margin-top:4px">
      <label class="field-label">怎么点</label>
      <div class="seg pk-mode">
        <button class="on" data-mode="no">按号码</button>
        <button data-mode="name" ${hasNames ? '' : 'disabled title="还没有名单，导入名单后才能按名字点"'}>按名单名字</button>
      </div>
    </div>
    <label class="pk-nr"><input type="checkbox" id="pk-norepeat"><span>不重复点同一人 <span class="tiny muted">（点完一轮前不会再出现）</span></span></label>
    <button class="btn primary block" id="go" style="height:56px;font-size:17px;margin-top:14px">${ICON.dice} 开始点名</button>
    <div class="pick-stage"><div class="pick-roll" id="stage">填好人数和点几个，点「开始点名」</div></div>
    <div id="history" class="tiny muted" style="text-align:center;min-height:18px"></div>
  </div>`;

  let mode = 'no';
  let norepeat = false;
  let pool = [];        // 不重复模式下「还没点到过」的
  let poolKey = '';     // 人数|模式，变了就重置池子

  const totalOf = () => Math.max(1, Math.min(200, Number($('#pk-total').value) || 1));
  // 池子：号码是 1..人数；名字是名单（人数框跟着名单长度走）
  const allOf = () => {
    if (mode === 'name' && hasNames) return names0.slice();
    const n = totalOf();
    return Array.from({ length: n }, (_, i) => String(i + 1));
  };
  const keyOf = () => `${mode}|${mode === 'name' ? names0.length : totalOf()}`;
  const resetPool = (force = false) => {
    const k = keyOf();
    if (!force && k === poolKey) return;
    poolKey = k; pool = allOf();
  };

  // 模式切换
  $('#s-body').querySelectorAll('[data-mode]').forEach((b) => {
    b.onclick = () => {
      if (b.disabled) return;
      mode = b.dataset.mode;
      $('#s-body').querySelectorAll('[data-mode]').forEach((x) => x.classList.toggle('on', x === b));
      if (mode === 'name') $('#pk-total').value = names0.length;
      resetPool(true);
      $('#history').textContent = norepeat ? `已点 0/${pool.length}，点完自动洗牌` : '';
    };
  });
  $('#pk-norepeat').onchange = (e) => {
    norepeat = e.target.checked;
    resetPool(true);
    $('#history').textContent = norepeat ? `已点 0/${pool.length}，点完自动洗牌重新开始` : '';
  };
  $('#pk-total').oninput = () => { if (norepeat) resetPool(); };
  resetPool(true);

  $('#go').onclick = () => {
    resetPool();
    const k = Math.max(1, Math.min(20, Number($('#pk-num').value) || 1));
    const whole = allOf();
    if (norepeat && pool.length < k) { pool = whole.slice(); poolKey = keyOf(); }
    const source = (norepeat ? pool : whole).slice();
    const picks = [];
    for (let i = 0; i < k && source.length; i++) {
      picks.push(source.splice(Math.floor(Math.random() * source.length), 1)[0]);
    }
    if (norepeat) pool = pool.filter((x) => !picks.includes(x));
    const label = (v) => (mode === 'name' ? v : v + ' 号');

    const btn = $('#go');
    btn.disabled = true;
    stage.className = 'pick-roll blur';
    let c = 0;
    const total = 16 + Math.floor(Math.random() * 6);
    const shown = whole.length ? whole : ['1'];
    const t = setInterval(() => {
      stage.textContent = label(shown[Math.floor(Math.random() * shown.length)]);
      if (++c > total) {
        clearInterval(t);
        btn.disabled = false;
        stage.className = '';
        if (picks.length === 1) {
          stage.className = 'pick-win';
          stage.textContent = label(picks[0]);
        } else {
          stage.innerHTML = `<div class="pick-names">${picks.map((p) => `<span class="pick-win sm">${esc(label(p))}</span>`).join('')}</div>`;
        }
        try { navigator.vibrate?.([40, 60, 90]); } catch {}
        if (norepeat) {
          $('#history').textContent = pool.length
            ? `已点 ${whole.length - pool.length}/${whole.length} 人，还剩 ${pool.length} 人`
            : '全班都点过了，下次点击自动洗牌重来';
        } else {
          $('#history').textContent = `从 ${whole.length} ${mode === 'name' ? '个名字' : '个号码'}里点了 ${picks.length} 个`;
        }
      }
    }, 62);
  };
  return;
}

    const KEY_DONE = 'wb_punish_done_' + code;

    // 只认当前还存在的任务（老师删掉的任务不该永久占着名额）

          roster_id: cls.roster_id || null,

      }

  };

/* 年级 / 班级选项来自老师的课表（/public/link 下发的 classes）；
   旧版后端还没下发时，退回到花名册，保证下拉框不会只剩一行提示。 */
function classChoices() {
  const pairMap = new Map();
  [...(data?.classes || []), ...(data?.rosters || [])].forEach((r) => {
    const grade = String(r?.grade || '').trim();
    const class_name = String(r?.class_name || '').trim();
    if (!grade && !class_name) return;
    pairMap.set(grade + '\u0000' + class_name, { grade, class_name });
  });
  const classPairs = [...pairMap.values()];
  /* numeric: true 是关键：班号直接拼在年级后面（高二10班 / 高二5班），
     不带它的话按字符比，10 班会排到 5 班前面，和学生手里的名单对不上。 */
  const gradeList = [...new Set(classPairs.map((r) => r.grade).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN', { numeric: true }));
  const classesOf = (grade) => [...new Set(classPairs.filter((r) => r.grade === grade).map((r) => r.class_name).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'zh-CN', { numeric: true }));
  /* 兼容旧偏好：以前只存了「高一 · 1 班」一整串 */
  const splitCls = (text) => {
    const t = String(text || '').trim();
    if (!t) return { grade: '', class_name: '' };
    const hit = classPairs.find((r) => clsName(r.grade, r.class_name) === t);
    if (hit) return hit;
    const parts = t.split(/[·.\s]+/).filter(Boolean);
    return parts.length >= 2 ? { grade: parts[0], class_name: parts.slice(1).join(' ') } : { grade: '', class_name: t };
  };
  return { classPairs, gradeList, classesOf, splitCls };
}

/* ---------- 违纪：学生填报，教师端查看与编辑 ---------- */
function paintMisconduct() {
  const { classPairs, gradeList, classesOf, splitCls } = classChoices();
  const saved = prefs();
  const pref = saved.misconduct_grade !== undefined
    ? { grade: String(saved.misconduct_grade || '').trim(), class_name: String(saved.misconduct_cls || '').trim() }
    : splitCls(saved.misconduct_cls);
  const auto = splitCls(myClass());
  const curGrade = pref.grade || auto.grade;
  const curClass = pref.class_name || auto.class_name;
  const otherGrade = !!curGrade && !gradeList.includes(curGrade);
  const initialClasses = curGrade ? classesOf(curGrade) : [];
  const otherClass = !!curClass && !initialClasses.includes(curClass);
  $('#s-body').innerHTML = `<div class="card card-pad">
    <div class="card-title">${ICON.alert} 违纪登记</div>
    <div class="tiny muted" style="margin:4px 0 12px">选择你所在的年级班级，填写违纪情况后提交，老师会在教师端看到。</div>
    <div class="field">
      <label class="field-label">年级</label>
      <select class="input" id="mc-grade">
        <option value="">请选择年级</option>
        ${gradeList.map((g) => `<option${g === curGrade ? ' selected' : ''}>${esc(g)}</option>`).join('')}
        <option value="__other__"${otherGrade ? ' selected' : ''}>其他（手动填写）</option>
      </select>
      <input class="input" id="mc-grade-custom" placeholder="例如：高一" value="${otherGrade ? esc(curGrade) : ''}" style="display:none;margin-top:8px">
    </div>
    <div class="field">
      <label class="field-label">班级</label>
      <select class="input" id="mc-cls">
        <option value="">请选择班级</option>
        ${initialClasses.map((c) => `<option${c === curClass ? ' selected' : ''}>${esc(c)}</option>`).join('')}
        <option value="__other__"${otherClass ? ' selected' : ''}>其他（手动填写）</option>
      </select>
      <input class="input" id="mc-cls-custom" placeholder="例如：1 班" value="${otherClass ? esc(curClass) : ''}" style="display:none;margin-top:8px">
    </div>
    <div class="field">
      <label class="field-label">违纪情况</label>
      <textarea class="input" id="mc-text" rows="4" placeholder="写清楚时间、地点和具体情节"></textarea>
    </div>
    <div class="row" style="justify-content:flex-end;align-items:center;gap:10px">
      <span class="tiny" id="mc-tip" style="color:var(--green)"></span>
      <button class="btn primary" id="mc-send">提交</button>
    </div>
  </div>`;
  const tip = (msg, bad) => { const t = $('#mc-tip'); t.textContent = msg; t.style.color = bad ? 'var(--red)' : 'var(--green)'; };
  const gradeSelect = $('#mc-grade');
  const gradeCustom = $('#mc-grade-custom');
  const clsSelect = $('#mc-cls');
  const clsCustom = $('#mc-cls-custom');
  const syncCustom = () => {
    const customGrade = gradeSelect.value === '__other__';
    gradeCustom.style.display = customGrade ? '' : 'none';
    clsSelect.style.display = customGrade ? 'none' : '';
    clsCustom.style.display = (customGrade || clsSelect.value === '__other__') ? '' : 'none';
  };
  const fillClasses = (grade) => {
    clsSelect.innerHTML = '<option value="">请选择班级</option>'
      + classesOf(grade).map((c) => `<option>${esc(c)}</option>`).join('')
      + '<option value="__other__">其他（手动填写）</option>';
  };
  gradeSelect?.addEventListener('change', () => {
    if (gradeSelect.value === '__other__') {
      savePref('misconduct_grade', '');
    } else {
      fillClasses(gradeSelect.value);
      savePref('misconduct_grade', gradeSelect.value.trim());
      savePref('misconduct_cls', '');
    }
    syncCustom();
  });
  clsSelect?.addEventListener('change', () => {
    syncCustom();
    /* 手动填写的值没法拿去下次默认选中，只有选中具体班级时才记住偏好 */
    if (clsSelect.value !== '__other__') savePref('misconduct_cls', clsSelect.value.trim());
  });
  syncCustom();
  $('#mc-send')?.addEventListener('click', async () => {
    const customGrade = gradeSelect.value === '__other__';
    const grade = (customGrade ? gradeCustom.value : gradeSelect.value).trim();
    const classText = (customGrade || clsSelect.value === '__other__' ? clsCustom.value : clsSelect.value).trim();
    const content = $('#mc-text').value.trim();
    if (!grade) return tip('请先选择年级', true);
    if (!classText) return tip('请先选择班级', true);
    if (!content) return tip('请填写违纪情况', true);
    const hit = classPairs.find((r) => r.grade === grade && r.class_name === classText);
    const class_name = hit ? hit.class_name : classText;
    const btn = $('#mc-send');
    btn.disabled = true; btn.textContent = '提交中…';
    try {
      await api(`/public/link/${code}/misconduct`, { grade, class_name, content });
      $('#mc-text').value = '';
      tip('已提交，老师那边可以看到了');
    } catch (error) {
      tip(error.message || '提交失败，请稍后再试', true);
    } finally { btn.disabled = false; btn.textContent = '提交'; }
  });
}

/* ---------- 留言板：学生填报，教师端查看与编辑 ---------- */
function paintBulletin() {
  /* 年级 / 班级同样取自课表（与违纪登记共用一份选项）；
     没有匹配项时保留「其他（手动填写）」，避免课表还没排课时无法提交。 */
  const { classPairs, gradeList, classesOf, splitCls } = classChoices();
  const saved = prefs();
  const pref = saved.bulletin_grade !== undefined
    ? { grade: String(saved.bulletin_grade || '').trim(), class_name: String(saved.bulletin_cls || '').trim() }
    : splitCls(saved.bulletin_cls);
  const auto = splitCls(myClass());
  const curGrade = pref.grade || auto.grade;
  const curClass = pref.class_name || auto.class_name;
  const otherGrade = !!curGrade && !gradeList.includes(curGrade);
  const initialClasses = curGrade ? classesOf(curGrade) : [];
  const otherClass = !!curClass && !initialClasses.includes(curClass);
  $('#s-body').innerHTML = `<div class="card card-pad">
    <div class="card-title">${ICON.chat} 留言板</div>
    <div class="tiny muted" style="margin:4px 0 12px">写下想说的话，老师会在教师端的留言板里看到。</div>
    <div class="row wrap" style="gap:8px">
      <div class="field" style="flex:1;min-width:140px">
        <label class="field-label">年级</label>
        <select class="input" id="bl-grade">
          <option value="">请选择年级</option>
          ${gradeList.map((g) => `<option${g === curGrade ? ' selected' : ''}>${esc(g)}</option>`).join('')}
          <option value="__other__"${otherGrade ? ' selected' : ''}>其他（手动填写）</option>
        </select>
        <input class="input" id="bl-grade-custom" placeholder="例如：高一" value="${otherGrade ? esc(curGrade) : ''}" style="display:none;margin-top:8px">
      </div>
      <div class="field" style="flex:1;min-width:140px">
        <label class="field-label">班级</label>
        <select class="input" id="bl-class">
          <option value="">请选择班级</option>
          ${initialClasses.map((c) => `<option${c === curClass ? ' selected' : ''}>${esc(c)}</option>`).join('')}
          <option value="__other__"${otherClass ? ' selected' : ''}>其他（手动填写）</option>
        </select>
        <input class="input" id="bl-class-custom" placeholder="例如：3 班" value="${otherClass ? esc(curClass) : ''}" style="display:none;margin-top:8px">
      </div>
    </div>
    <div class="field">
      <label class="field-label">留言内容</label>
      <textarea class="input" id="bl-text" rows="4" placeholder="想对老师说的话"></textarea>
    </div>
    <div class="row" style="justify-content:flex-end;align-items:center;gap:10px">
      <span class="tiny" id="bl-tip" style="color:var(--green)"></span>
      <button class="btn primary" id="bl-send">提交</button>
    </div>
  </div>`;
  const tip = (msg, bad) => { const t = $('#bl-tip'); t.textContent = msg; t.style.color = bad ? 'var(--red)' : 'var(--green)'; };
  const gradeSelect = $('#bl-grade');
  const gradeCustom = $('#bl-grade-custom');
  const clsSelect = $('#bl-class');
  const clsCustom = $('#bl-class-custom');
  const syncCustom = () => {
    const customGrade = gradeSelect.value === '__other__';
    gradeCustom.style.display = customGrade ? '' : 'none';
    clsSelect.style.display = customGrade ? 'none' : '';
    clsCustom.style.display = (customGrade || clsSelect.value === '__other__') ? '' : 'none';
  };
  const fillClasses = (grade) => {
    clsSelect.innerHTML = '<option value="">请选择班级</option>'
      + classesOf(grade).map((c) => `<option>${esc(c)}</option>`).join('')
      + '<option value="__other__">其他（手动填写）</option>';
  };
  gradeSelect?.addEventListener('change', () => {
    if (gradeSelect.value === '__other__') {
      savePref('bulletin_grade', '');
    } else {
      fillClasses(gradeSelect.value);
      savePref('bulletin_grade', gradeSelect.value.trim());
      savePref('bulletin_cls', '');
    }
    syncCustom();
  });
  clsSelect?.addEventListener('change', () => {
    syncCustom();
    if (clsSelect.value !== '__other__') savePref('bulletin_cls', clsSelect.value.trim());
  });
  syncCustom();
  $('#bl-send')?.addEventListener('click', async () => {
    const customGrade = gradeSelect.value === '__other__';
    const grade = (customGrade ? gradeCustom.value : gradeSelect.value).trim();
    const class_name = (customGrade || clsSelect.value === '__other__' ? clsCustom.value : clsSelect.value).trim();
    const content = $('#bl-text').value.trim();
    if (!grade && !class_name) return tip('请选择年级或班级', true);
    if (!content) return tip('请填写留言内容', true);
    const hit = classPairs.find((r) => r.grade === grade && r.class_name === class_name);
    const cls = hit ? hit.class_name : class_name;
    const btn = $('#bl-send');
    btn.disabled = true; btn.textContent = '提交中…';
    try {
      await api(`/public/link/${code}/bulletin`, { grade, class_name: cls, content });
      $('#bl-text').value = '';
      tip('已提交，老师那边可以看到了');
    } catch (error) {
      tip(error.message || '提交失败，请稍后再试', true);
    } finally { btn.disabled = false; btn.textContent = '提交'; }
  });
}

init();
</script>
