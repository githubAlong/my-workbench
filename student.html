<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>班级资料站</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007aff">
<link rel="stylesheet" href="css/app.css">
<style>
  body { background: linear-gradient(170deg, #eef4ff 0%, #f7f9ff 42%, #f5f7fb 100%); min-height: 100vh; }
  html[data-theme=dark] body { background: linear-gradient(170deg, #101a2c, #0f131c 50%); }
  .s-wrap { max-width: 820px; margin: 0 auto; padding: 18px 14px 40px; }
  .s-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .s-logo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg,#007aff,#af52de); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .s-tabs { display: flex; gap: 6px; background: rgba(255,255,255,.8); padding: 5px; border-radius: 14px; margin-bottom: 16px; box-shadow: var(--shadow-s); }
  html[data-theme=dark] .s-tabs { background: rgba(255,255,255,.06); }
  .s-tabs button { display: flex; align-items: center; justify-content: center; gap: 4px; flex: 1; min-width: 0;
    height: 40px; border-radius: 10px; font-weight: 650; font-size: 14px; color: var(--text-2);
    white-space: nowrap; overflow: hidden; }
  .s-tabs button svg { flex: 0 0 auto; }
  @media (max-width: 400px) { .s-tabs button { font-size: 13px; gap: 3px; } .s-tabs button svg { width: 15px; height: 15px; } }
  .s-tabs button.on { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(60,123,246,.3); }
  .big-num { font-family: var(--mono); font-size: 84px; font-weight: 700; line-height: 1; letter-spacing: -4px; }
  .pick-num { display: inline-grid; place-items: center; min-width: 84px; height: 84px; border-radius: 22px; background: linear-gradient(135deg,#007aff,#af52de); color: #fff; font-size: 38px; font-weight: 700; font-family: var(--mono); margin: 6px; }
  .mat-card { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
  .mat-card:last-child { border-bottom: 0; }
  /* 签到 */
  .s-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff3b30; display: inline-block; margin-left: 2px; animation: sb 1.4s infinite; }
  @keyframes sb { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .ck-me { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 9px 12px;
    border-radius: 10px; background: rgba(0,122,255,.08); font-size: 13.5px; }
  html[data-theme=dark] .ck-me { background: rgba(10,132,255,.15); }
  .ck-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-top: 16px; }
  .ck-b { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    height: 84px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card);
    font-size: 15px; font-weight: 650; color: var(--text); cursor: pointer; transition: .15s; font-family: inherit; }
  .ck-b:active { transform: scale(.97); }
  .ck-b:disabled { opacity: .55; }
  .ck-b.ok { border-color: rgba(52,199,89,.5); color: #248a3d; background: rgba(52,199,89,.07); }
  .ck-b.warn { border-color: rgba(255,159,10,.5); color: #b26b00; background: rgba(255,159,10,.07); }
  .ck-b.mute { padding: 0 18px; font-size: 13.5px; color: var(--text-2); }
  html[data-theme=dark] .ck-b.ok { color: #30d158; }
  html[data-theme=dark] .ck-b.warn { color: #ff9f0a; }
  .ck-done { padding: 11px 13px; border-radius: 10px; background: rgba(52,199,89,.1);
    border: 1px solid rgba(52,199,89,.28); font-size: 13.5px; line-height: 1.5; }
  @media (max-width: 380px) { .ck-grid { grid-template-columns: 1fr 1fr; } .ck-b.mute { grid-column: span 2; height: 44px; } }
  .roll { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }

  /* ---------- 抽人：滚动轮播 + 揭晓 ---------- */
  .pick-stage { position: relative; display: grid; place-items: center; min-height: 132px; margin: 16px 0 4px;
    border-radius: 18px; background: rgba(0,122,255,.06); overflow: hidden; }
  html[data-theme=dark] .pick-stage { background: rgba(10,132,255,.12); }
  .pick-roll { font-size: 40px; font-weight: 700; line-height: 1.15; letter-spacing: -1px;
    color: var(--text-2); transition: filter .12s; }
  .pick-roll.blur { filter: blur(1.2px); opacity: .75; }
  .pick-win { font-size: 46px; font-weight: 750; line-height: 1.12; letter-spacing: -1.5px;
    color: var(--primary); animation: pop .38s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0% { transform: scale(.55); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
  .pick-names { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
  .pick-win.sm { font-size: 26px; display: inline-block; padding: 8px 16px; border-radius: 14px;
    background: var(--primary); color: #fff; letter-spacing: -.5px; animation: pop .38s cubic-bezier(.34,1.56,.64,1); }
  /* 抽人（第 19 条）：班级/人数/抽几个 三个输入并排 */
  .pk-grid { display: grid; grid-template-columns: 1.4fr .8fr .8fr; gap: 10px; }
  @media (max-width: 420px) { .pk-grid { grid-template-columns: 1fr 1fr; } .pk-grid > .field:first-child { grid-column: 1 / -1; } }
  .pk-recent { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 2px 0 10px; }
  .pk-chip { padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--card);
    font-size: 12.5px; color: var(--text-2); cursor: pointer; }
  .pk-chip:active { background: var(--primary-weak); }
  .pk-mode { display: flex; width: 100%; }
  .pk-mode button { flex: 1; }
  .pk-mode button[disabled] { opacity: .42; cursor: not-allowed; }
  .pk-nr { display: flex; align-items: center; gap: 9px; margin-top: 12px; font-size: 14px; }
  .pk-nr input { width: 18px; height: 18px; accent-color: var(--primary); }
  .cfg-row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 13px; border-radius: 11px; background: var(--bg-sunken); margin-top: 10px; font-size: 14px; }
  .sw { position: relative; flex: 0 0 auto; width: 44px; height: 26px; border-radius: 99px;
    background: var(--line); border: 0; cursor: pointer; transition: .18s; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: .18s; }
  .sw.on { background: var(--green, #34c759); }
  .sw.on::after { left: 21px; }

  /* ---------- 惩罚盲盒 ---------- */
  .box-stage { position: relative; display: grid; place-items: center; min-height: 168px; margin: 14px 0;
    border-radius: 20px; padding: 18px 14px; text-align: center;
    background: linear-gradient(150deg, rgba(0,122,255,.1), rgba(175,82,222,.1));
    border: 1.5px dashed rgba(0,122,255,.35); transition: .25s; }
  html[data-theme=dark] .box-stage { background: linear-gradient(150deg, rgba(10,132,255,.16), rgba(191,90,242,.14));
    border-color: rgba(10,132,255,.45); }
  .box-stage.open { border-style: solid; border-color: transparent; animation: pop .4s cubic-bezier(.34,1.56,.64,1); }
  .box-stage.open::after { content: ''; position: absolute; inset: 0; border-radius: 20px;
    background: radial-gradient(circle at 50% 0%, rgba(255,214,10,.28), transparent 65%); pointer-events: none; }
  .box-icon { font-size: 46px; line-height: 1; }
  .box-shake { animation: shake .42s ease-in-out infinite; }
  @keyframes shake { 0%,100% { transform: rotate(-7deg) } 50% { transform: rotate(7deg) } }
  .box-text { font-size: 25px; font-weight: 750; line-height: 1.35; letter-spacing: -.5px; margin-top: 8px;
    position: relative; z-index: 1; }
  .box-lv { display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 650; letter-spacing: .3px;
    padding: 3px 10px; border-radius: 99px; position: relative; z-index: 1; }
  .box-lv.l1 { background: rgba(52,199,89,.16); color: #248a3d; }
  .box-lv.l2 { background: rgba(255,159,10,.18); color: #a86200; }
  .box-lv.l3 { background: rgba(255,59,48,.15); color: #c22a22; }
  html[data-theme=dark] .box-lv.l1 { color: #30d158; }
  html[data-theme=dark] .box-lv.l2 { color: #ff9f0a; }
  html[data-theme=dark] .box-lv.l3 { color: #ff453a; }
  .box-who { font-size: 13px; color: var(--text-2); margin-top: 10px; position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="s-wrap" id="s-app"><div class="empty">加载中…</div></div>
<script type="module" src="student.bundle.js"></script>
</body>
</html>
